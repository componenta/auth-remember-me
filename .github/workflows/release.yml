name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite
          tools: composer:2.9.8@sha256:59b2c50e10cafa0d8efc19ede9a326d782f096c674a26baf98cf042ce23de890
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - if: matrix.php == '8.4'
        run: composer audit --no-interaction
      - run: composer phpstan
      - run: composer test

  publish:
    if: startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$first_line" =~ ^Release[[:space:]](v[0-9]+\.[0-9]+\.[0-9]+)(:[[:space:]].*)?$ ]]; then
            tag="${BASH_REMATCH[1]}"
          else
            echo "Invalid release tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
